<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramas de Clases UML - Kerbal Program Space</title>
    <!-- Mermaid CDN standard UMD (compatible con file://) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #161b22;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-tabs {
            display: flex;
            gap: 6px;
            background-color: #0b0e14;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            color: #e6edf3;
            background-color: #21262d;
        }
        .tab-btn.active {
            color: #58a6ff;
            background-color: #1f6feb22;
            border: 1px solid #1f6feb;
        }
        .controls {
            display: flex;
            gap: 6px;
        }
        .ctrl-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            background-color: #30363d;
            color: #58a6ff;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(#161b22 1px, #0d1117 1px);
            background-size: 20px 20px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvasContainer:active {
            cursor: grabbing;
        }
        #viewport {
            transform-origin: 0 0;
            transition: transform 0.05s ease-out;
            display: inline-block;
            padding: 40px;
        }
        .mermaid {
            user-select: none;
        }
        .info-pill {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(22, 27, 34, 0.92);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.8rem;
            color: #8b949e;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <header>
        <h1>◆ Kerbal Program Space — UML</h1>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab(0)">1. Dominio Espacial</button>
            <button class="tab-btn" onclick="switchTab(1)">2. Motor & Radar</button>
            <button class="tab-btn" onclick="switchTab(2)">3. Interfaz Gráfica</button>
            <button class="tab-btn" onclick="switchTab(3)">4. Arquitectura General</button>
            <button class="tab-btn" onclick="switchTab(4)">5. Diagrama Completo Unificado</button>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="zoomIn()">Zoom +</button>
            <button class="ctrl-btn" onclick="zoomOut()">Zoom -</button>
            <span id="zoomLevel" class="ctrl-btn" style="pointer-events: none; min-width: 60px; text-align: center; color: #58a6ff;">100%</span>
            <button class="ctrl-btn" onclick="resetView()">Centrar</button>
        </div>
    </header>

    %% Relaciones jerárquicas normalizadas
    RadarRenderable <|.. OrbitalObject : Implementación
    OrbitalObject "1" *-- "1" SpacecraftInfo : Composición (1..1) contiene identidad
    OrbitalObject "1" *-- "1" GeoPosition : Composición (1..1) posee coordenadas

    OrbitalObject <|-- SpaceDebris : Herencia
    SpaceDebris <|-- RogueDebris : Herencia

    OrbitalObject <|-- SpaceStation : Herencia
    SpaceStation "1" *-- "2" PercentageGauge : Composición (1..2) O2 y batería
    SpaceStation ..|> EvasiveCapable : Implementación

    OrbitalObject <|-- Spacecraft : Herencia
    Spacecraft "1" *-- "1" FuelTank : Composición (1..1) tanque propulsión
    Spacecraft ..|> FuelCarrier : Implementación

    Spacecraft <|-- ExplorationProbe : Herencia
    Spacecraft <|-- CrewShuttle : Herencia
    CrewShuttle "1" *-- "0..*" Kerbal : Composición (1..N) tripulación
    Kerbal "0..*" --> "1" KerbalRole : Asociación (N..1) rol asignado

    Spacecraft <|-- CargoShip : Herencia
    CargoShip "0..*" --> "1" MissionState : Asociación (N..1) estado misión
    CargoShip ..> PrecisionGauge : Dependencia (1..1) minijuego acople`,

    %% Relaciones con Tipo y Multiplicidad
    SimulationEngine "1" *-- "1" FlightLogbook : Composición (1..1) registra bitácora
    SimulationEngine "1" *-- "1" Radar : Composición (1..1) administra radar
    Radar "1" *-- "1" GeoPosition : Composición (1..1) centro radar

    SimulationEngine "1" *-- "1" OrbitalEventSpawner : Composición (1..1) spawner eventos
    SimulationEngine "1" *-- "0..*" OrbitalObject : Composición (1..N) rastrea objetos
    OrbitalObject ..|> EvasiveCapable : Implementación (maniobra evasiva)

    SimulationEngine ..> TelemetryLogger : Dependencia (emite logs)
    TelemetryLogger ..> ExternalMonitorLauncher : Dependencia (abre terminal PS1)
    TelemetryLogger ..> FuelCarrier : Dependencia (formatea tanque)

    SimulationEngine "1" o-- "1" N2YOApiClient : Agregación (1..1) cliente REST
    N2YOApiClient "1" *-- "1" N2YOJsonParser : Composición (1..1) delega parseo JSON
    N2YOApiClient ..> ApiConfig : Dependencia (resuelve API Key)
    N2YOApiClient ..> SpacecraftFactory : Dependencia (solicita creación)`,

    %% ================= RELACIONES JERÁRQUICAS PLANARES =================
    Main ..> MainGUI : Dependencia (1..1) inicia GUI
    MainGUI "1" *-- "1" HeaderBarPanel : Composición (1..1) panel norte

    MainGUI "1" *-- "1" ShipMonitorPanel : Composición (1..1) panel este
    ShipMonitorPanel ..> ShipImageLoader : Dependencia (carga íconos)

    MainGUI "1" *-- "1" SimulationController : Composición (1..1) delega eventos

    SimulationController ..> FlightLogbookDialogView : Dependencia (abre bitácora)
    SimulationController ..> CrisisController : Dependencia (evalúa amenazas)
    CrisisController ..> CrisisDialogView : Dependencia (alerta impacto)
    SimulationController "1" *-- "0..1" MissionController : Composición (1..1) logística
    MissionController ..> MissionDialogView : Dependencia (reporte misión)
    MissionController ..> DockingMinigameDialog : Dependencia (abre minijuego)
    DockingMinigameDialog "1" *-- "1" PrecisionGauge : Composición (1..1) barra acople

    SimulationController "1" *-- "0..1" SimulationEngine : Composición (1..1) administra motor
    SimulationEngine "1" *-- "1" FlightLogbook : Composición (1..1) bitácora vuelo
    SimulationEngine "1" *-- "1" Radar : Composición (1..1) escanea sector
    SimulationEngine "1" *-- "1" OrbitalEventSpawner : Composición (1..1) genera eventos
    SimulationEngine ..> TelemetryLogger : Dependencia (emite logs)
    TelemetryLogger ..> ExternalMonitorLauncher : Dependencia (abre PS1)
    SimulationEngine "1" o-- "1" N2YOApiClient : Agregación (1..1) cliente REST
    N2YOApiClient "1" *-- "1" N2YOJsonParser : Composición (1..1) parsea JSON
    N2YOApiClient ..> ApiConfig : Dependencia (lee API Key)
    N2YOApiClient ..> SpacecraftFactory : Dependencia (crea estación)

    SimulationEngine "1" *-- "0..*" OrbitalObject : Composición (1..N) rastrea objetos
    OrbitalObject ..|> RadarRenderable : Implementación
    OrbitalObject "1" *-- "1" SpacecraftInfo : Composición (1..1) identidad
    OrbitalObject "1" *-- "1" GeoPosition : Composición (1..1) coordenadas
    OrbitalObject <|-- SpaceDebris : Herencia
    SpaceDebris <|-- RogueDebris : Herencia
    OrbitalObject <|-- SpaceStation : Herencia
    SpaceStation "1" *-- "2" PercentageGauge : Composición (1..2) O2 y batería
    SpaceStation ..|> EvasiveCapable : Implementación
    OrbitalObject <|-- Spacecraft : Herencia
    Spacecraft ..|> FuelCarrier : Implementación
    Spacecraft "1" *-- "1" FuelTank : Composición (1..1) tanque
    Spacecraft <|-- ExplorationProbe : Herencia
    Spacecraft <|-- CrewShuttle : Herencia
    CrewShuttle "1" *-- "0..*" Kerbal : Composición (1..N) tripulación
    Kerbal "0..*" --> "1" KerbalRole : Asociación (N..1) rol
    Spacecraft <|-- CargoShip : Herencia
    CargoShip "0..*" --> "1" MissionState : Asociación (N..1) estado misión`
        ];

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose'
        });

        async function renderDiagram(code) {
            const target = document.getElementById('diagramTarget');
            target.removeAttribute('data-processed');
            target.innerHTML = '';
            const { svg } = await mermaid.render('mermaidGraph_' + Date.now(), code);
            target.innerHTML = svg;
            const svgEl = target.querySelector('svg');
            if (svgEl) {
                svgEl.style.width = '1250px';
                svgEl.style.height = 'auto';
                svgEl.style.maxWidth = 'none';
            }
            resetView();
        }

        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            renderDiagram(diagrams[index]);
        }

        function updateTransform() {
            const viewport = document.getElementById('viewport');
            viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            const zoomPill = document.getElementById('zoomLevel');
            if (zoomPill) {
                zoomPill.textContent = Math.round(scale * 100) + '%';
            }
        }

        function zoomIn() {
            scale = Math.min(scale * 1.20, 30.0);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.20, 0.05);
            updateTransform();
        }

        function resetView() {
            scale = 1.0;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        const container = document.getElementById('canvasContainer');
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1.08 : 0.93;
            scale = Math.min(Math.max(scale * delta, 0.05), 30.0);
            updateTransform();
        });

        window.addEventListener('DOMContentLoaded', () => {
            switchTab(0);
        });
    </script>
