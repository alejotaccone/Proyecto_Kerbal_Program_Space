<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramas de Clases UML - Kerbal Program Space</title>
    <!-- Mermaid CDN standard UMD (compatible con file://) -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #161b22;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 {
            font-size: 1.1rem;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-tabs {
            display: flex;
            gap: 6px;
            background-color: #0b0e14;
            padding: 4px;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #8b949e;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            color: #e6edf3;
            background-color: #21262d;
        }
        .tab-btn.active {
            color: #58a6ff;
            background-color: #1f6feb22;
            border: 1px solid #1f6feb;
        }
        .controls {
            display: flex;
            gap: 6px;
        }
        .ctrl-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            background-color: #30363d;
            color: #58a6ff;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(#161b22 1px, #0d1117 1px);
            background-size: 20px 20px;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvasContainer:active {
            cursor: grabbing;
        }
        #viewport {
            transform-origin: 0 0;
            transition: transform 0.05s ease-out;
            display: inline-block;
            padding: 40px;
        }
        .mermaid {
            user-select: none;
        }
        .info-pill {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(22, 27, 34, 0.92);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 0.8rem;
            color: #8b949e;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

    <header>
        <h1>◆ Kerbal Program Space — UML</h1>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab(0)">1. Dominio Espacial</button>
            <button class="tab-btn" onclick="switchTab(1)">2. Motor & Radar</button>
            <button class="tab-btn" onclick="switchTab(2)">3. Interfaz Gráfica</button>
            <button class="tab-btn" onclick="switchTab(3)">4. Arquitectura General</button>
            <button class="tab-btn" onclick="switchTab(4)">5. Diagrama Completo Unificado</button>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="zoomIn()">Zoom +</button>
            <button class="ctrl-btn" onclick="zoomOut()">Zoom -</button>
            <span id="zoomLevel" class="ctrl-btn" style="pointer-events: none; min-width: 60px; text-align: center; color: #58a6ff;">100%</span>
            <button class="ctrl-btn" onclick="resetView()">Centrar</button>
        </div>
    </header>

    <div id="canvasContainer">
        <div id="viewport">
            <div id="diagramTarget" class="mermaid"></div>
        </div>
        <div class="info-pill">Arrastrá con el mouse para moverte | Rueda para Zoom</div>
    </div>

    <script>
        const diagrams = [
            // Tab 0: Dominio Espacial
            `classDiagram
    class RadarRenderable {
        <<interface>>
        +getColorRadar() Color
        +getTamanoIconoRadar() int
        +esIconoTriangular() boolean
        +tieneAnilloRadar() boolean
    }
    class FuelCarrier {
        <<interface>>
        +getFuelTank() FuelTank
        +getEtiquetaCombustible() String
    }
    class EvasiveCapable {
        <<interface>>
        +evade(double deltaLat, double deltaLng) boolean
    }
    class OrbitalObject {
        <<abstract>>
        -SpacecraftInfo info
        -GeoPosition position
        -double velocityKmH
        -String nombreImagen
        +move()*
        +getType()* String
        +performSpecialAbility()* String
        +getDetalleTelemetria()* String
        +distanceTo(OrbitalObject other) double
    }
    class SpacecraftInfo {
        -String id
        -String name
        -int noradId
        +getId() String
        +getName() String
        +getNoradId() int
    }
    class Spacecraft {
        <<abstract>>
        -FuelTank fuelTank
        +move()
        +evade(double deltaLat, double deltaLng) boolean
        +refuel(double amount) boolean
        +getFuelTank() FuelTank
    }
    class SpaceStation {
        -String stationType
        -String imagenDestruida
        -String textoDestruccion
        -FuelTank fuelTank
        -PercentageGauge oxygenGauge
        -PercentageGauge batteryGauge
        -double temperature
        -boolean solarPanelsDeployed
        +SpaceStation(info, pos, img, type, imgDest, txtDest)
        +move()
        +refuelShip(Spacecraft ship) boolean
        +getFuelTank() FuelTank
        +getEtiquetaCombustible() String
        +getDetalleTelemetria() String
        +getColorRadar() Color
        +tieneAnilloRadar() boolean
    }
    class CargoShip {
        -double cargoCapacityTons
        -double currentCargoTons
        +performSpecialAbility() String
        +getDetalleTelemetria() String
        +getColorRadar() Color
    }
    class CrewShuttle {
        -List~Kerbal~ crew
        +addCrewMember(Kerbal kerbal)
        +agregarTripulante(String name, KerbalRole role, int courage)
        +performSpecialAbility() String
        +getDetalleTelemetria() String
    }
    class ExplorationProbe {
        -double solarEfficiency
        +performSpecialAbility() String
        +getDetalleTelemetria() String
    }
    class SpaceDebris {
        -double hazardLevel
        +move()
        +performSpecialAbility() String
        +getDetalleTelemetria() String
        +esIconoTriangular() boolean
    }
    class RogueDebris {
        -OrbitalObject target
        +move()
        +getTarget() OrbitalObject
    }
    class GeoPosition {
        -double latitude
        -double longitude
        -double altitude
        +distanceTo(GeoPosition other) double
    }
    class FuelTank {
        -double capacity
        -double currentLevel
        -double consumptionRate
        +consume(double amount) boolean
        +refuel(double amount) void
        +getPercentage() double
    }
    class PercentageGauge {
        -double level
        +increase(double amount)
        +decrease(double amount)
        +isAbove(double threshold) boolean
    }
    class Kerbal {
        -String name
        -KerbalRole role
        -int courage
        +ejecutarManiobraPilotaje() String
    }
    class KerbalRole {
        <<enumeration>>
        PILOT
        ENGINEER
        SCIENTIST
    }

    RadarRenderable <|.. OrbitalObject : implements (ISP)
    FuelCarrier <|.. Spacecraft : implements (ISP)
    EvasiveCapable <|.. Spacecraft : implements (ISP)
    FuelCarrier <|.. SpaceStation : implements (ISP)

    OrbitalObject <|-- Spacecraft
    OrbitalObject <|-- SpaceStation
    OrbitalObject <|-- SpaceDebris
    Spacecraft <|-- CargoShip
    Spacecraft <|-- CrewShuttle
    Spacecraft <|-- ExplorationProbe
    SpaceDebris <|-- RogueDebris

    OrbitalObject *-- "1" SpacecraftInfo : contiene
    OrbitalObject *-- "1" GeoPosition : ubicado en
    Spacecraft *-- "1" FuelTank : posee tanque
    SpaceStation *-- "1" FuelTank : reserva acople
    SpaceStation *-- "1" PercentageGauge : oxigeno
    SpaceStation *-- "1" PercentageGauge : bateria
    CrewShuttle *-- "0..*" Kerbal : tripulacion
    Kerbal --> "1" KerbalRole : rol
    RogueDebris --> "1" OrbitalObject : persigue`,

            // Tab 1: Motor & Radar
            `classDiagram
    class SimulationEngine {
        -int currentTick
        -List~OrbitalObject~ trackedObjects
        -Radar radar
        -N2YOApiClient apiClient
        -OrbitalEventSpawner eventSpawner
        -int monitoredShipIndex
        -int targetStationNoradId
        +SimulationEngine(String apiKey, int targetNoradId)
        +SimulationEngine(N2YOApiClient api, OrbitalEventSpawner spawner, int noradId)
        +tick()
        +syncWithN2YO()
        +setTargetStation(int noradId)
        +evadeShip(int index) boolean
        +refuelShipAtStation(int shipIndex) boolean
        +useSpecialAbility(int shipIndex) String
        +triggerCrisisEvent() boolean
    }
    class Radar {
        -String observerCity
        -GeoPosition location
        -double coverageRadiusKm
        +detectCollisionRisks(List~OrbitalObject~ allObjects) List~String~
        +actualizarUbicacion(GeoPosition nuevaPos)
    }
    class OrbitalEventSpawner {
        +evaluarEventosAleatoriosPorTick(List~OrbitalObject~ trackedObjects)
        +spawnSpaceDebris(List~OrbitalObject~ trackedObjects) boolean
        +triggerCrisisEvent(List~OrbitalObject~ trackedObjects) boolean
    }
    class SpacecraftFactory {
        +crearDesdeDatosN2YO(int noradId, String satName, GeoPosition pos)$ OrbitalObject
    }
    class N2YOApiClient {
        -String apiKey
        -HttpClient httpClient
        -N2YOJsonParser jsonParser
        +fetchRealSatellite(int noradId) OrbitalObject
        +fetchRealSatellitePosition(int noradId, GeoPosition fallback) GeoPosition
        -sendGet(String url, Duration timeout) String
    }
    class N2YOJsonParser {
        +contienePosiciones(String json) boolean
        +parseSatelliteName(String json, int noradId) String
        +parsePositionFromJson(String json) GeoPosition
        -extractJsonDouble(String json, String key) double
        -extractJsonString(String json, String key) String
    }
    class TelemetryLogger {
        +printHeader(int tick, String observerCity)$
        +printSpacecraftStatus(List~OrbitalObject~ ships)$
        +printAlerts(List~String~ alerts)$
        +generarResumenNave(OrbitalObject ship)$ String
        -formatearCombustible(StringBuilder sb, OrbitalObject ship)$
        +launchMonitorConsole()$
    }
    class ExternalMonitorLauncher {
        +lanzarConsolaPowerShell(String archivoMonitor)$
    }
    class GeoPosition {
        -double latitude
        -double longitude
        -double altitude
    }
    class OrbitalObject {
        <<abstract>>
    }
    class FuelCarrier {
        <<interface>>
        +getFuelTank() FuelTank
        +getEtiquetaCombustible() String
    }
    class EvasiveCapable {
        <<interface>>
        +evade(double deltaLat, double deltaLng) boolean
    }

    SimulationEngine *-- "0..*" OrbitalObject : trackedObjects
    SimulationEngine *-- "1" Radar : radar
    SimulationEngine *-- "1" OrbitalEventSpawner : eventSpawner
    SimulationEngine o-- "1" N2YOApiClient : apiClient
    SimulationEngine ..> EvasiveCapable : ejecuta maniobra (ISP)
    Radar *-- "1" GeoPosition : location
    N2YOApiClient *-- "1" N2YOJsonParser : delega parseo JSON (SRP)
    N2YOApiClient ..> SpacecraftFactory : usa para crear
    SpacecraftFactory ..> OrbitalObject : instancia e inyecta config (OCP)
    OrbitalEventSpawner ..> OrbitalObject : instancia eventos
    TelemetryLogger ..> ExternalMonitorLauncher : lanza proceso
    TelemetryLogger ..> OrbitalObject : formatea datos
    TelemetryLogger ..> FuelCarrier : consulta tanque (ISP)`,

            // Tab 2: Interfaz Gráfica (Patrón MVC - Iteración 4)
            `classDiagram
    class MainGUI {
        <<Vista Principal - JFrame>>
        -HeaderBarPanel headerBarPanel
        -ControlPanel controlPanel
        -RadarPanel radarPanel
        -ShipMonitorPanel shipMonitorPanel
        -ConsolePanel consolePanel
        -JSplitPane splitPane
        -SimulationController controller
        +MainGUI()
        +logConsola(String mensaje)
        +mostrarSenalPerdida(SpaceStation station)
        +getHeaderBarPanel() HeaderBarPanel
        +getControlPanel() ControlPanel
        +getRadarPanel() RadarPanel
        +getShipMonitorPanel() ShipMonitorPanel
        +getConsolePanel() ConsolePanel
        +getSplitPane() JSplitPane
        +getController() SimulationController
    }
    class SimulationController {
        <<Controlador Principal>>
        -MainGUI vista
        -SimulationEngine engine
        -Timer simulationTimer
        -Timer radarSweepTimer
        -boolean simulationRunning
        -int tickCount
        +SimulationController(MainGUI vista)
        +iniciarSimulacion()
        +detenerSimulacion()
        +cambiarEstacion()
        +ejecutarTickSimulacion()
        +ejecutarManiobraEvasion()
        +ejecutarHabilidadEspecial()
        +ejecutarRecargaCombustible()
        +generarCrisis()
        +sincronizarDatosRadar()
        +actualizarMonitorNave()
        +actualizarComboNaves()
    }
    class CrisisController {
        <<Controlador de Crisis>>
        +evaluarEventosCrisis(Component parent, SimulationEngine engine, Runnable onPausar, Runnable onReanudar, Consumer log, Consumer onDestruida)$ boolean
        -buscarAmenazaRogue(SimulationEngine engine)$ RogueDebris
        -procesarDecisionCrisis(Component parent, int seleccion, OrbitalObject target, SimulationEngine engine, Consumer log, Consumer onDestruida)$
        -manejarDestruccionObjeto(Component parent, OrbitalObject target, SimulationEngine engine, Consumer onDestruida)$
        -finalizarCrisis(RogueDebris threat, SimulationEngine engine, Runnable onReanudar)$
    }
    class CrisisDialogView {
        <<Vista de Diálogos Modales>>
        +mostrarDialogoDecisionCrisis(Component parent, String amenaza, double dist, String objetivo)$ int
        +mostrarDialogoEstacionDestruida(Component parent, String img, String texto)$ void
        -crearBotonTactico(String texto, Color col)$ JButton
    }
    class HeaderBarPanel {
        <<Componente Vista>>
        -JLabel lblTitulo
        -JLabel lblTickCount
        +actualizarEstadoTick(int tick, String estado, String hora)
    }
    class ControlPanel {
        <<Componente Vista>>
        -JComboBox cmbEstacion
        -JTextField txtApiKey
        -JButton btnIniciar
        -JButton btnDetener
        -JButton btnCambiarEstacion
        -JComboBox cmbNaves
        -JButton btnEvadeShip
        -JButton btnSpecialAbility
        -JButton btnRefuel
        -JButton btnGenerarCrisis
        +actualizarComboNaves(List~OrbitalObject~ naves, JSplitPane sp)
        +setEstadoOnline(boolean online)
        +getSelectedNoradId() int
        +getSelectedShipIndex() int
        +addIniciarListener(ActionListener l)
        +addDetenerListener(ActionListener l)
    }
    class RadarPanel {
        <<Componente Vista>>
        -List~OrbitalObject~ naves
        -GeoPosition centroPos
        -double radioKm
        -int selectedIndex
        +setNaves(List~OrbitalObject~ naves)
        +setCentro(GeoPosition pos, double radioKm)
        +avanzarBarrido()
        +getShipIndexAt(int x, int y) int
    }
    class ShipMonitorPanel {
        <<Componente Vista>>
        -JLabel lblImagenNave
        -JTextArea txtMonitorNave
        +actualizar(OrbitalObject nave)
        +mostrarSenalPerdida(SpaceStation station)
    }
    class ConsolePanel {
        <<Componente Vista>>
        -JTextArea txtConsola
        +log(String mensaje)
        +clear()
    }
    class ShipImageLoader {
        <<Servicio UI>>
        +cargarImagenNave(JLabel lbl, String nombreImagen)$
        +obtenerImageIconEscalado(String nombreImagen, int w, int h)$ ImageIcon
    }
    class SimulationEngine {
        <<Modelo de Simulación>>
    }
    class RadarRenderable {
        <<interface Vista/Modelo>>
    }

    MainGUI *-- "1" HeaderBarPanel : compone
    MainGUI *-- "1" ControlPanel : compone
    MainGUI *-- "1" RadarPanel : compone
    MainGUI *-- "1" ShipMonitorPanel : compone
    MainGUI *-- "1" ConsolePanel : compone
    MainGUI *-- "1" SimulationController : delega al controlador
    SimulationController o-- "1" MainGUI : actualiza vista
    SimulationController o-- "1" SimulationEngine : orquesta modelo
    SimulationController ..> CrisisController : invoca evaluación
    CrisisController ..> CrisisDialogView : solicita mostrar diálogo
    CrisisController ..> SimulationEngine : aplica impacto/evasión
    RadarPanel ..> RadarRenderable : renderiza blips
    ShipMonitorPanel ..> ShipImageLoader : carga foto
    CrisisDialogView ..> ShipImageLoader : carga imagen destruida`,

            // Tab 3: Arquitectura General (Tríada MVC - Iteración 4)
            `classDiagram
    class Vista_MainGUI {
        <<Capa Vista - GUI>>
    }
    class Vista_Paneles {
        <<Capa Vista - Componentes UI>>
    }
    class Vista_CrisisDialog {
        <<Capa Vista - Modales Tácticos>>
    }
    class SimulationController {
        <<Capa Controlador - Orquestador>>
    }
    class CrisisController {
        <<Capa Controlador - Lógica Crisis>>
    }
    class SimulationEngine {
        <<Capa Modelo - Motor de Negocio>>
    }
    class OrbitalObject {
        <<Capa Modelo - Entidad Dominio>>
    }
    class Radar {
        <<Capa Modelo - Telemetría>>
    }
    class N2YOApiClient {
        <<Capa Modelo - Integración REST>>
    }
    class TelemetryLogger {
        <<Capa Modelo - Servicio Logging>>
    }

    Vista_MainGUI *-- Vista_Paneles : ensambla
    Vista_MainGUI --> SimulationController : notifica eventos de usuario
    SimulationController o-- "1" SimulationEngine : modifica estado de negocio
    SimulationController --> Vista_MainGUI : actualiza datos en pantalla
    SimulationController ..> CrisisController : delega chequeo de riesgo
    CrisisController ..> Vista_CrisisDialog : solicita orden al usuario
    CrisisController --> SimulationEngine : ejecuta evasión o impacto
    SimulationEngine *-- "0..*" OrbitalObject : gestiona entidades
    SimulationEngine *-- "1" Radar : calcula proximidad física
    SimulationEngine o-- "1" N2YOApiClient : sincroniza satélites en vivo
    SimulationEngine ..> TelemetryLogger : emite telemetría`,

            // Tab 4: Diagrama Completo Unificado de Todo el Sistema (Iteración 4)
            `classDiagram
    direction TB

    %% ================= CAPA MODELO: COMPONENTES Y GEOMETRIA =================
    class GeoPosition {
        -double latitude
        -double longitude
        -double altitude
        +distanceTo(GeoPosition other) double
    }

    class FuelTank {
        -double capacity
        -double currentLevel
        -double consumptionRate
        +consume(double amount) boolean
        +refuel(double amount) void
        +getPercentage() double
    }

    class PercentageGauge {
        -double level
        +increase(double amount) void
        +decrease(double amount) void
        +isAbove(double threshold) boolean
    }

    class KerbalRole {
        <<enumeration>>
        PILOT
        ENGINEER
        SCIENTIST
    }

    class Kerbal {
        -String name
        -KerbalRole role
        -int courage
        +ejecutarManiobraPilotaje() String
        +esAptoParaPilotar() boolean
    }

    %% ================= CAPA MODELO: INTERFACES =================
    class RadarRenderable {
        <<interface>>
        +getColorRadar() Color
        +getTamanoIconoRadar() int
        +esIconoTriangular() boolean
        +tieneAnilloRadar() boolean
    }

    class FuelCarrier {
        <<interface>>
        +getFuelTank() FuelTank
        +getEtiquetaCombustible() String
    }

    class EvasiveCapable {
        <<interface>>
        +evade(double deltaLat, double deltaLng) boolean
    }

    %% ================= CAPA MODELO: JERARQUIA ORBITAL =================
    class SpacecraftInfo {
        -String id
        -String name
        -int noradId
        +getId() String
        +getName() String
        +getNoradId() int
    }

    class OrbitalObject {
        <<abstract>>
        -SpacecraftInfo info
        -GeoPosition position
        -double velocityKmH
        -String nombreImagen
        +move()* void
        +getType()* String
        +performSpecialAbility()* String
        +getDetalleTelemetria()* String
        +distanceTo(OrbitalObject other) double
    }

    class Spacecraft {
        <<abstract>>
        -FuelTank fuelTank
        +move() void
        +evade(double deltaLat, double deltaLng) boolean
        +refuel(double amount) boolean
        +getFuelTank() FuelTank
    }

    class SpaceStation {
        -String stationType
        -String imagenDestruida
        -String textoDestruccion
        -FuelTank fuelTank
        -PercentageGauge oxygenGauge
        -PercentageGauge batteryGauge
        -double temperature
        -boolean solarPanelsDeployed
        +move() void
        +refuelShip(Spacecraft ship) boolean
        +getDetalleTelemetria() String
    }

    class CargoShip {
        -double cargoCapacityTons
        -double currentCargoTons
        +performSpecialAbility() String
        +getDetalleTelemetria() String
    }

    class CrewShuttle {
        -List~Kerbal~ crew
        +addCrewMember(Kerbal k) void
        +agregarTripulante(String nom, KerbalRole r, int c) void
        +performSpecialAbility() String
    }

    class ExplorationProbe {
        -double solarEfficiency
        +performSpecialAbility() String
    }

    class SpaceDebris {
        -double hazardLevel
        +move() void
    }

    class RogueDebris {
        -OrbitalObject target
        +move() void
        +getTarget() OrbitalObject
    }

    %% ================= CAPA MODELO: RADAR, API Y MOTOR =================
    class Radar {
        -String observerCity
        -GeoPosition observerPosition
        -double coverageRadiusKm
        +detectCollisionRisks(List~OrbitalObject~ all) List~String~
        +actualizarUbicacion(GeoPosition nueva) void
    }

    class N2YOJsonParser {
        +contienePosiciones(String json) boolean
        +parseSatelliteName(String json, int noradId) String
        +parsePositionFromJson(String json) GeoPosition
    }

    class SpacecraftFactory {
        +crearDesdeDatosN2YO(int noradId, String name, GeoPosition pos)$ OrbitalObject
    }

    class N2YOApiClient {
        -String apiKey
        -HttpClient httpClient
        -N2YOJsonParser jsonParser
        +fetchRealSatellite(int noradId) OrbitalObject
        +fetchRealSatellitePosition(int noradId, GeoPosition fallback) GeoPosition
    }

    class OrbitalEventSpawner {
        +evaluarEventosAleatoriosPorTick(List~OrbitalObject~ list) void
        +spawnSpaceDebris(List~OrbitalObject~ list) boolean
        +triggerCrisisEvent(List~OrbitalObject~ list) boolean
    }

    class TelemetryLogger {
        +printHeader(int tick, String city)$ void
        +printSpacecraftStatus(List~OrbitalObject~ ships)$ void
        +printAlerts(List~String~ alerts)$ void
        +generarResumenNave(OrbitalObject ship)$ String
        +writeShipMonitorFile(OrbitalObject ship, String action)$ void
        +launchMonitorConsole()$ void
    }

    class ExternalMonitorLauncher {
        +lanzarConsolaPowerShell(String archivoMonitor)$ void
    }

    class SimulationEngine {
        -int currentTick
        -List~OrbitalObject~ trackedObjects
        -Radar radar
        -N2YOApiClient apiClient
        -OrbitalEventSpawner eventSpawner
        -int monitoredShipIndex
        -int targetStationNoradId
        +tick() void
        +setTargetStation(int noradId) void
        +syncWithN2YO() void
        +evadeShip(int index) boolean
        +refuelShipAtStation(int idx) boolean
        +useSpecialAbility(int idx) String
        +triggerCrisisEvent() boolean
        +removeShip(OrbitalObject ship) void
    }

    %% ================= CAPA CONTROLADOR =================
    class SimulationController {
        -MainGUI vista
        -SimulationEngine engine
        -Timer simulationTimer
        -Timer radarSweepTimer
        -boolean simulationRunning
        -int tickCount
        +iniciarSimulacion() void
        +detenerSimulacion() void
        +cambiarEstacion() void

        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;

        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose'
        });

        async function renderDiagram(code) {
            const target = document.getElementById('diagramTarget');
            target.removeAttribute('data-processed');
            target.innerHTML = '';
            const { svg } = await mermaid.render('mermaidGraph_' + Date.now(), code);
            target.innerHTML = svg;
            resetView();
        }

        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            renderDiagram(diagrams[index]);
        }

        function updateTransform() {
            const viewport = document.getElementById('viewport');
            viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            const zoomPill = document.getElementById('zoomLevel');
            if (zoomPill) {
                zoomPill.textContent = Math.round(scale * 100) + '%';
            }
        }

        function zoomIn() {
            scale = Math.min(scale * 1.20, 30.0);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.20, 0.05);
            updateTransform();
        }

        function resetView() {
            scale = 1.0;
            panX = 0;
            panY = 0;
            updateTransform();
        }

        const container = document.getElementById('canvasContainer');
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1.08 : 0.93;
            scale = Math.min(Math.max(scale * delta, 0.05), 30.0);
            updateTransform();
        });

        window.addEventListener('DOMContentLoaded', () => {
            switchTab(0);
        });
    </script>
